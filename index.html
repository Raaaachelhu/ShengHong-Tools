 let dirty=false;const el=name=>form.elements[name];
 const update=(resetPrice=true)=>{
  const p=selectedProduct(form),type=el('type').value,ret=type.endsWith('Return');$('#originalWrap').hidden=!ret;
  if(!p){$('#productPreview').innerHTML='<strong>请选择有效商品</strong><p>请展开商品编码下拉框并选择。</p>';el('price').value='';return;}
  const stock=C.calc(data,el('date').value).stocks[p.code];$('#productPreview').innerHTML=`<strong>${esc(p.name)}</strong><p>${esc(p.code)} · ${esc(p.category)} · ${esc(p.spec||'规格待补充')} · ${esc(p.unit)}</p><p>当日实物库存 ${num(stock.qty)} ${esc(p.unit)}　/　可用 ${num(stock.available)} ${esc(p.unit)} ${p.review?' · 商品信息待核对':''}</p>`;
  if(ret){const originalType={saleReturn:'sale',selfReturn:'self',purchaseReturn:'purchase'}[type];const prev=el('original').value;el('original').innerHTML='<option value="">请选择原单</option>'+data.transactions.filter(t=>!t.void&&t.code===p.code&&t.type===originalType&&t.date<=el('date').value).map(t=>{const used=data.transactions.filter(r=>!r.void&&r.original===t.id).reduce((a,r)=>a+r.qty,0);return `<option value="${esc(t.id)}">${esc(t.date)} / ${num(t.qty-used)} ${esc(p.unit)}可退 / ¥${money(t.price)} / #${t.seq}</option>`;}).join('');if([...el('original').options].some(o=>o.value===prev))el('original').value=prev;const orig=data.transactions.find(t=>t.id===el('original').value);el('price').value=orig?.price??'';el('price').readOnly=true;$('#priceHint').textContent='退回单价沿用原单，不覆盖历史成交价。';}
  else{el('price').readOnly=type==='self';if(resetPrice)el('price').value=type==='self'?Math.max(0,stock.avg).toFixed(6):C.priceAt(data,p.code,type,el('date').value);$('#priceHint').textContent=type==='self'?'按该日期已有流水的移动平均成本暂算，保存后保留本次金额。':type==='purchase'?'最近采购价仅供参考；确认本次实际采购价。':'最近三局成交价仅供参考；确认本次实际结算价。';}
  amount();
 };
 const amount=()=>{$('#entryAmount').textContent='¥ '+money((+el('qty').value||0)*(+el('price').value||0));};
 el('query').onchange=()=>{dirty=false;update();};el('type').onchange=()=>{dirty=false;update();};el('date').onchange=()=>update(!dirty);el('original').onchange=()=>update();el('qty').oninput=amount;el('price').oninput=()=>{dirty=true;amount();};
 form.onsubmit=e=>{e.preventDefault();const p=selectedProduct(form);if(!p)return toast('请先选择商品档案中的商品。');const type=el('type').value,date=el('date').value,qty=+el('qty').value,price=+el('price').value;if(date>today())return toast('实际出入库不能使用未来日期；待提货请建立订单。');if(!(qty>0)||price<0||!Number.isFinite(price))return toast('请填写有效数量和单价。');
  const original=el('original').value;if(type.endsWith('Return')&&!original)return toast('退回必须选择原始单据。');
  const stock=C.calc(data,date).stocks[p.code];if(C.sign(type)<0&&qty>stock.available+1e-8)return toast('可用库存不足，请先核对库存或处理待提货订单。');
  const t={id:uid(),seq:Math.max(0,...data.transactions.map(t=>t.seq))+1,date,type,code:p.code,qty,price,note:el('note').value.trim(),...(type.endsWith('Return')?{original,...(data.transactions.find(r=>r.id===original)?.orderId?{orderId:data.transactions.find(r=>r.id===original).orderId}:{})}:{})};
  const next=JSON.parse(JSON.stringify(data));next.transactions.push(t);
  // Backdated changes must not introduce a later stock shortage.
  if(!noNewShortages(data,next))return toast('这笔补录会使后续日期库存不足，请先核对历史流水。');
  if(commit(next,`新增${C.TYPES[type]} #${t.seq}`)){toast('已保存，库存和月报已更新。');if(e.submitter?.value==='done'){txType='';location.hash='inventory';}else{el('query').value='';el('qty').value='';el('price').value='';el('note').value='';$('#entryAmount').textContent='¥ 0.00';$('#productPreview').innerHTML='<strong>已保存，继续选择下一件商品</strong><p>日期和业务类型已保留。</p>';el('query').focus();}}
 };
 update();
}
function noNewShortages(old,next){const dates=[...new Set([...old.transactions,...next.transactions,...old.orders,...next.orders].map(t=>t.date))];for(const d of dates){const a=C.calc(old,d).stocks,b=C.calc(next,d).stocks;for(const code of Object.keys(b))if(b[code].available<Math.min(0,a[code]?.available||0)-1e-8)return false;}return true;}
function products(){const rows=data.products.filter(matches);return heading('PRODUCT LIBRARY','商品档案','维护一次，后续录单自动读取。历史价格不随档案修改而改变。','<button class="primary" data-action="product">＋ 新建商品</button>')+`<div class="toolbar"><input id="search" value="${esc(search)}" placeholder="搜索编码、名称或类别" aria-label="搜索商品"><span class="spacer"></span><button data-action="productCSV">导出商品 CSV</button><button data-action="csvImport">导入商品 CSV</button></div><section class="card">${table(['编码 / 类别','商品名称 / 规格','单位','参考进价','默认销售参考价','预警线','状态','操作'],rows.map(p=>`<tr><td>${esc(p.code)}<small>${esc(p.category)}</small></td><td>${esc(p.name)}<small>${esc(p.spec||'规格待补充')}</small></td><td>${esc(p.unit)}</td><td>${money(p.purchasePrice)}</td><td>${money(p.salePrice)}</td><td>${num(p.threshold)}</td><td>${p.review?pill('待核对','red'):pill('可用','green')}</td><td><button data-action="product" data-id="${esc(p.code)}">编辑</button></td></tr>`))}</section>`;}
function productModal(code){const p=product(code)||{code:'',name:'',category:'白酒',spec:'',unit:'瓶',purchasePrice:0,salePrice:0,threshold:0,review:false};showModal(code?'编辑商品档案':'新建商品档案',`<form id="productForm"><div class="fieldgrid">${[['code','商品编码',p.code,'text'],['name','商品名称',p.name,'text'],['category','类别',p.category,'text'],['spec','规格 / 换算说明',p.spec,'text'],['unit','基础单位',p.unit,'text'],['threshold','库存预警线',p.threshold,'number'],['purchasePrice','参考采购价',p.purchasePrice,'number'],['salePrice','默认销售参考结算价',p.salePrice,'number']].map(([k,label,value,type])=>`<div class="field"><label for="p_${k}">${label}</label><input id="p_${k}" name="${k}" type="${type}" value="${esc(value)}" ${k==='code'&&code?'readonly':''} ${type==='number'?'min="0" step="any"':''} ${['spec'].includes(k)?'':'required'} maxlength="100"></div>`).join('')}</div><div class="notice">单价默认对应基础单位。箱与瓶暂不自动互换：请按基础单位录入数量；规格栏仅用于说明。编码有业务后不能改名，发现重复编码请先核实。</div><label><input name="review" type="checkbox" ${p.review?'checked':''}> 此商品仍需核对包装或编码</label><div class="formbuttons"><button class="primary" type="submit">保存商品档案</button></div></form>`);
 $('#productForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),v=Object.fromEntries(f.entries());for(const k of ['code','name','category','spec','unit'])v[k]=(v[k]||'').trim();for(const k of ['purchasePrice','salePrice','threshold'])v[k]=+v[k];v.review=f.has('review');if(!/^[A-Za-z0-9_-]+$/.test(v.code))return toast('编码仅使用字母、数字、下划线或短横线。');if(!v.name||!v.unit)return toast('请补齐名称与单位。');if(!code&&product(v.code))return toast('编码已存在，请直接编辑。');if(code&&data.transactions.some(t=>t.code===code)&&v.unit!==p.unit)return toast('已有流水的商品不能直接改单位，请新建不同规格的商品。');if(mutate(d=>{const i=d.products.findIndex(p=>p.code===v.code);if(i>=0)d.products[i]=v;else d.products.push(v);},`保存商品 ${v.code}`)){closeModal();render();toast('商品档案已保存。');}};
}
function inventory(){const s=C.calc(data,today()).stocks;const ps=data.products.filter(p=>matches(p)&&(!stockFilter||s[p.code].available<=p.threshold));const trs=data.transactions.filter(t=>!t.void&&(!month||t.date.startsWith(month))&&(!txType||t.type===txType)&&matches(product(t.code)||{})).slice().sort((a,b)=>b.date.localeCompare(a.date)||b.seq-a.seq);return heading('INVENTORY & LEDGER','库存与流水','库存截至今天；流水可按月和业务筛选。原始记录保留来源行号。')+provisional()+`<div class="toolbar"><input id="search" value="${esc(search)}" placeholder="搜索商品编码或名称" aria-label="搜索库存"><select id="stockFilter" aria-label="库存范围"><option value="">全部库存</option><option value="low" ${stockFilter?'selected':''}>仅看预警</option></select><button data-action="inventoryCSV">导出库存 CSV</button></div><section class="card"><div class="cardhead"><h2>实时库存</h2><span class="muted">${ps.length} 个商品</span></div>${table(['商品','基础单位','实物数量','未提货占用','可用数量','预警线','成本状态'],ps.map(p=>{const v=s[p.code];return `<tr><td>${esc(p.name)}<small>${esc(p.code)}</small></td><td>${esc(p.unit)}</td><td>${num(v.qty)}</td><td>${num(v.reserved)}</td><td>${pill(num(v.available),v.available<=p.threshold?'red':'green')}</td><td>${num(p.threshold)}</td><td>${pill(v.uncertain||data.meta.opening!=='已核定'?'待核定':'按流水计算',v.uncertain?'red':'')}</td></tr>`;}))}</section><section class="card"><div class="cardhead"><h2>出入库流水</h2><span class="muted">${trs.length} 笔</span></div><div class="toolbar"><input id="month" aria-label="流水月份，留空显示全部" type="month" value="${esc(month)}"><select id="txType" aria-label="流水业务"><option value="">全部业务</option>${Object.entries(C.TYPES).map(([k,v])=>`<option value="${k}" ${txType===k?'selected':''}>${v}</option>`).join('')}</select><button data-action="clearFilter">清除筛选</button><span class="spacer"></span><button data-action="ledgerCSV">导出筛选流水 CSV</button></div>${table(['日期 / 编号','类型','商品','数量','单价','金额','备注 / 来源','操作'],trs.map(t=>`<tr><td>${esc(t.date)}<small>#${t.seq}</small></td><td>${kind(t.type)}${t.clientId?'<small>'+esc(clientName(t.clientId))+'</small>':''}</td><td>${esc(product(t.code)?.name)}<small>${esc(t.code)}</small></td><td>${num(t.qty)} ${esc(product(t.code)?.unit)}</td><td>${money(t.price)}</td><td class="amount">${money(C.ledgerAmount(t))}</td><td class="wraptext">${esc(t.note)}<small>${esc(t.source||'工作台录入')}${t.review?' · 待核对':''}</small></td><td><button class="danger" data-action="void" data-id="${esc(t.id)}">作废</button></td></tr>`))}</section>`;}
function reports(){const rows=C.report(data,dateMonth(),client),isSale=client==='sale',amount=rows.reduce((a,t)=>a+t.amount,0);const groups={};for(const t of rows){const g=groups[t.code]||(groups[t.code]={code:t.code,qty:0,amount:0});g.qty+=t.net;g.amount+=t.amount;}const title=isSale?'中建三局 · 月度销售统计':'老板自用 · 月度领用统计';return heading('MONTHLY STATEMENTS','月度统计','保存流水后自动归集；按业务发生月份展示退回和原单，不跨月覆盖。')+`<div class="toolbar">${monthInput()}<select id="client" aria-label="报表对象"><option value="sale" ${isSale?'selected':''}>中建三局</option><option value="self" ${!isSale?'selected':''}>老板自用</option></select><select id="reportTab" aria-label="明细或汇总"><option value="detail" ${tab==='detail'?'selected':''}>逐笔明细</option><option value="summary" ${tab==='summary'?'selected':''}>按商品汇总</option></select><span class="spacer"></span><button data-action="reportCSV">导出本表 CSV</button><button class="primary" data-action="print">打印 / 存为 PDF</button></div>${provisional()}<section class="card" id="reportPrint"><div class="reportheader"><div><div class="eyebrow">HONGSHENG CELLAR / MONTHLY REPORT</div><h2 class="reporttitle">${esc(title)}</h2><p class="sub">统计月份：${esc(dateMonth())}　·　${tab==='detail'?'逐笔明细':'按商品汇总'}</p></div><small>${isSale?'销售金额未包含独立对账价差':'按原流水记录单价计值'}<br>期初状态：${esc(data.meta.opening||'未核定')}</small></div>${tab==='detail'?table(['日期','类型','商品 / 编码','规格','单位','净数量','记录单价','净金额'],rows.map(t=>{const p=product(t.code);return `<tr><td>${esc(t.date)}</td><td>${esc(C.TYPES[t.type])}</td><td>${esc(p?.name)}<small>${esc(t.code)}</small></td><td>${esc(p?.spec||'待补充')}</td><td>${esc(p?.unit)}</td><td>${num(t.net)}</td><td>${money(t.price)}</td><td class="amount">${money(t.amount)}</td></tr>`;})):table(['商品 / 编码','规格','单位','净数量','净金额'],Object.values(groups).map(g=>{const p=product(g.code);return `<tr><td>${esc(p.name)}<small>${esc(g.code)}</small></td><td>${esc(p.spec||'待补充')}</td><td>${esc(p.unit)}</td><td>${num(g.qty)}</td><td class="amount">${money(g.amount)}</td></tr>`;}))}<div class="amountbox"><span>${rows.length} 笔记录 · ${Object.keys(groups).length} 种商品 · 退回以负数抵减</span><strong>¥ ${money(amount)}</strong></div><p class="sub" style="margin-top:15px">${isSale?'中建三局基础设施建设投资有限公司':'老板自用 / 盛总自用'} · 生成日期 ${today()}。库存成本和历史异常尚未确认前，不输出确定毛利。</p></section>`;}
function orders(){const active=data.orders.filter(o=>!o.void);return heading('ORDERS & RECONCILIATION','对账与提货','订货占用可用库存；实际提货才扣实物库存。每次提货自动生成三局出库。','<button class="primary" data-action="order">＋ 新建待提货订单</button>')+`<div class="notice">本页管理新建订单。原表订货与实际提货的历史对应关系尚待核对，未自动迁移，避免重复扣库存。对外对账请到「月度统计」选择中建三局导出；旧表中的商品替换与价差未自动生成。</div><section class="card">${table(['订货日期 / 编号','商品','订货数量','已提净数量','剩余未提','结算单价','操作'],active.map(o=>{const d=C.delivered(data,o.id),p=product(o.code);return `<tr><td>${esc(o.date)}<small>${esc(o.id.slice(-8))}</small></td><td>${esc(p.name)}<small>${esc(p.code)}</small></td><td>${num(o.qty)} ${esc(p.unit)}</td><td>${num(d)}</td><td>${pill(num(o.qty-d),o.qty>d?'red':'green')}</td><td>${money(o.price)}</td><td>${o.qty>d?`<button data-action="fulfill" data-id="${esc(o.id)}">登记提货</button>`:pill('已提完','green')} <button class="danger" data-action="cancelOrder" data-id="${esc(o.id)}">关闭订单</button></td></tr>`;}))}</section><section class="card guide"><h2>两条计算规则</h2><p>① 下单后，实物数量不变，可用数量减少；分批提货会同步减少实物数量及未提货占用。</p><p>② 关闭订单只释放未提货占用，不撤销已发生的实际出库。退回货物请在「快速录单」关联原提货单。</p></section>`;}
function orderModal(){showModal('新建待提货订单',`<form id="orderForm"><div class="fieldgrid"><div class="field"><label>订货日期</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>客户</label><input value="中建三局" readonly></div><div class="field full"><label>商品</label><select name="code" required><option value="">请选择商品</option>${data.products.map(p=>`<option value="${esc(p.code)}">${esc(p.code)} · ${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>订货数量（基础单位）</label><input name="qty" type="number" min="0.001" step="0.001" required></div><div class="field"><label>结算单价</label><input name="price" type="number" min="0" step="any" required></div></div><div class="notice">保存后立即占用可用库存，库存不足时不能建立订单。</div><div class="formbuttons"><button class="primary" type="submit">保存订单</button></div></form>`);const f=$('#orderForm');f.elements.code.onchange=()=>f.elements.price.value=C.priceAt(data,f.elements.code.value,'sale',f.elements.date.value);f.onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(f)),o={...v,qty:+v.qty,price:+v.price,id:uid()};if(o.date>today())return toast('订货日期不能晚于今天。');const next=JSON.parse(JSON.stringify(data));next.orders.push(o);if(!noNewShortages(data,next))return toast('订单占用后库存不足，请先入库或核对历史库存。');if(commit(next,'建立待提货订单 '+o.id)){closeModal();render();toast('订单已保存，可用库存已更新。');}};}
function fulfillModal(id){const o=data.orders.find(o=>o.id===id),p=product(o.code),remaining=o.qty-C.delivered(data,id);showModal('登记实际提货',`<form id="fulfillForm"><div class="productpreview"><strong>${esc(p.name)}</strong><p>剩余 ${num(remaining)} ${esc(p.unit)} · 单价 ¥${money(o.price)}</p></div><div class="fieldgrid"><div class="field"><label>实际提货日期</label><input name="date" type="date" value="${today()}" min="${esc(o.date)}" max="${today()}" required></div><div class="field"><label>本次提货数量</label><input name="qty" type="number" min="0.001" step="0.001" max="${remaining}" required></div></div><div class="formbuttons"><button class="primary" type="submit">确认提货并生成出库</button></div></form>`);$('#fulfillForm').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));const next=JSON.parse(JSON.stringify(data));next.transactions.push({id:uid(),seq:Math.max(0,...data.transactions.map(t=>t.seq))+1,date:v.date,type:'sale',code:o.code,qty:+v.qty,price:o.price,orderId:id,note:'待提货订单实际提货'});if(!noNewShortages(data,next))return toast('库存不足，不能登记提货。');if(commit(next,'订单实际提货 '+id)){closeModal();render();toast('已生成三局出库，月报同步更新。');}};}
function legacySettings(){return heading('DATA & PREFERENCES','数据与设置','数据留在当前浏览器。更新网页代码不会主动覆盖经营数据；更换网址、浏览器或清理缓存后需要恢复备份。')+`<div class="grid2"><div><section class="card"><div class="cardhead"><h2>导入与备份</h2>${pill('本机存储')}</div><p class="sub">${data.products.length} 个商品 · ${data.transactions.filter(t=>!t.void).length} 笔有效流水 · ${data.orders.filter(o=>!o.void).length} 张订单</p><div class="toolbar"><button class="primary" data-action="import">导入历史数据 / 恢复备份</button><button data-action="backup">导出完整 JSON 备份</button></div><div class="notice wine">本版本网页内置真实商品、价格和历史流水，公开发布后访问者也能读取。页面没有账号权限；新录入仍只存当前浏览器。</div><p class="sub">恢复采用整份替换，导入前先下载现有备份。原表36个商品编码、448笔流水和192组对账已内置；此处也可恢复最新JSON备份。当前不直接解析任意Excel。</p><button data-action="demo">打开演示数据（独立于真实记录）</button></section><section class="card"><div class="cardhead"><h2>历史数据核对</h2>${pill(data.meta.opening||'未核定','red')}</div><p class="sub">成本仅按现有流水暂算。确认期初库存应在业务核实后进行；确认状态不会调整任何数量。</p>${data.issues.length?data.issues.map((i,idx)=>`<div class="issue"><b>${pill(i.resolved?'已记录处理说明':'待核对',i.resolved?'green':'red')} ${esc(i.title)}</b><p>${esc(i.detail)}</p>${i.resolution?`<p>处理说明：${esc(i.resolution)}</p>`:''}<button data-action="issue" data-id="${idx}">${i.resolved?'修改处理说明':'记录处理说明'}</button></div>`).join(''):'<div class="empty">没有待导入的历史核对项。</div>'}<div class="toolbar"><button data-action="opening">记录期初核定状态</button></div></section></div><div><section class="card guide"><h2>本机版的使用边界</h2><p>适合单人、固定浏览器日常使用。保存成功后，页面即时重新计算；多个标签页会提示重新加载。</p><p>不同设备、不同浏览器的数据不会自动同步。建议每天结束时导出完整JSON备份；恢复时选择最近一次备份。</p><p>本版已实现商品档案、客户档案、采购与出库月报、并排对账、库存、CSV导出、提货订单、备份恢复与作废留痕。</p><p>已加入独立对账中心，支持实际与结算两侧、成本、毛利、价差和账期。收付款、账期催收、完整财务损益与自动箱瓶换算尚未接入。</p><button data-action="guide">查看部署与使用说明</button></section><section class="card"><div class="cardhead"><h2>最近操作</h2></div>${(data.audit||[]).slice(-10).reverse().map(a=>`<div class="auditrow">${esc(a.action)}<small class="muted" style="display:block">${esc(new Date(a.time).toLocaleString('zh-CN'))}</small></div>`).join('')||'<p class="sub">暂无操作记录</p>'}</section></div></div>`;}
function showModal(title,body){$('#modal').classList.remove('wide');$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modal').showModal();}
function closeModal(){$('#modal').close();}
function confirmModal(title,text,fn){showModal(title,`<p>${esc(text)}</p><div class="formbuttons"><button data-action="close">取消</button><button class="primary" id="confirmAction">确认</button></div>`);$('#confirmAction').onclick=()=>{closeModal();fn();};}
function download(name,text,type='application/json'){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function backup(){download(`宏盛酒庄_完整备份_${today()}.json`,JSON.stringify(data,null,2));toast('备份已交给浏览器下载，请妥善保存。');}
function csv(name,rows){const cell=v=>{const s=String(v??'');return '"'+(/^[=+@\t\r]/.test(s)||/^-\D/.test(s)?"'":'')+s.replace(/"/g,'""')+'"';};download(name,'\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8');}
function exportReport(){const rows=C.report(data,dateMonth(),client);if(tab==='summary'){const g={};for(const t of rows){const a=g[t.code]||(g[t.code]={qty:0,amount:0});a.qty+=t.net;a.amount+=t.amount;}csv(`${dateMonth()}_${client==='sale'?'三局销售':'老板自用'}_汇总.csv`,[['商品编码','商品名称','规格','单位','净数量','净金额'],...Object.entries(g).map(([code,v])=>{const p=product(code);return [code,p.name,p.spec,p.unit,v.qty,C.round(v.amount)];})]);}else csv(`${dateMonth()}_${client==='sale'?'三局销售':'老板自用'}_明细.csv`,[['日期','类型','编码','商品','规格','单位','净数量','单价','净金额'],...rows.map(t=>{const p=product(t.code);return [t.date,C.TYPES[t.type],t.code,p.name,p.spec,p.unit,t.net,t.price,t.amount];})]);}
function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++;}else quoted=!quoted;}else if(c===','&&!quoted){row.push(cell);cell='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(c=>c.trim()))rows.push(row);row=[];cell='';}else cell+=c;}if(quoted)throw Error('CSV引号未闭合');row.push(cell);if(row.some(c=>c.trim()))rows.push(row);return rows;}

 else if(action==='inventoryCSV'){const stocks=C.calc(data,today()).stocks;csv('库存_'+today()+'.csv',[['商品编码','商品名称','单位','实物数量','未提货占用','可用数量','预警线'],...data.products.filter(matches).map(p=>[p.code,p.name,p.unit,stocks[p.code].qty,stocks[p.code].reserved,stocks[p.code].available,p.threshold])]);}
 else if(action==='ledgerCSV')csv('出入库流水.csv',[['日期','类型','商品编码','商品名称','单位','数量','单价','金额','备注','来源'],...data.transactions.filter(t=>!t.void&&(!month||t.date.startsWith(month))&&(!txType||t.type===txType)&&matches(product(t.code)||{})).map(t=>[t.date,C.TYPES[t.type],t.code,product(t.code)?.name,product(t.code)?.unit,t.qty,t.price,C.ledgerAmount(t),t.note,t.source])]);
 else if(action==='void'){const t=data.transactions.find(t=>t.id===id);if(data.transactions.some(r=>!r.void&&r.original===id))return toast('原单有有效退回记录，请先作废关联退回。');confirmModal('作废这笔流水？',`#${t.seq} ${C.TYPES[t.type]} ${product(t.code).name} ${num(t.qty)}。原记录将保留，作废后重新计算库存与月报。`,()=>{const next=JSON.parse(JSON.stringify(data));next.transactions.find(t=>t.id===id).void=true;if(!noNewShortages(data,next))return toast('作废会造成库存不足或订单超额，请先处理后续业务。');if(commit(next,'作废流水 #'+t.seq)){render();toast('已作废并重新计算。');}});}
 else if(action==='order')orderModal();
 else if(action==='fulfill')fulfillModal(id);
 else if(action==='cancelOrder')confirmModal('关闭待提货订单？','只释放剩余占用，已提货记录继续保留。',()=>{if(mutate(d=>d.orders.find(o=>o.id===id).void=true,'关闭订单 '+id))render();});
 else if(action==='issue'){const i=data.issues[+id];showModal('记录核对说明',`<form id="issueForm"><h3>${esc(i.title)}</h3><p class="sub">${esc(i.detail)}</p><div class="field"><label>处理说明</label><textarea name="resolution" rows="4" required maxlength="1000">${esc(i.resolution||'')}</textarea></div><p class="sub">此操作只保存说明，不修改历史流水、编码或价格。</p><div class="formbuttons"><button class="primary">保存说明</button></div></form>`);$('#issueForm').onsubmit=e=>{e.preventDefault();const r=e.target.elements.resolution.value.trim();if(!r)return;if(mutate(d=>{d.issues[+id].resolved=true;d.issues[+id].resolution=r;},'记录异常核对说明')){closeModal();render();}};}
 else if(action==='opening'){showModal('期初核定状态',`<form id="openingForm"><p class="sub">请完成实物盘点和历史差异核对。此处不会自动补库存，若需要期初数量，请在正式上线前整理准确的期初及切换日期。</p><div class="field"><label>核定状态</label><select name="opening"><option>未核定</option><option>已核定</option></select></div><div class="field"><label>核对说明 / 盘点依据</label><textarea name="note" required rows="3"></textarea></div><div class="formbuttons"><button class="primary">记录状态</button></div></form>`);$('#openingForm').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));if(v.opening==='已核定'&&data.issues.some(i=>!i.resolved))return toast('仍有未处理的历史核对项，请先记录处理说明。');if(mutate(d=>{d.meta.opening=v.opening;d.meta.openingNote=v.note;},'记录期初状态 '+v.opening)){closeModal();render();}};}
 else if(action==='guide')showModal('v1.3 工作台使用说明',`<div class="guide"><ol><li>解压下载包，上传全部文件到GitHub仓库根目录，覆盖旧index.html；部署后页脚应显示v1.3。</li><li>月度统计默认显示采购与出库总览，可下拉选择本月采购、全部出库、客户销售、老板自用，再按具体客户筛选。</li><li>左侧「客户档案」可修改中建三局名称和对账抬头，或新增中建五局；旧流水的客户归属按固定ID保留。</li><li>「对账中心」已内置原表192组对账，实际与结算两侧独立保存。新建时勾选客户实际出库带入，可复制到结算侧再修改；结算侧不扣库存。</li><li>对账可保存草稿、确认、撤回确认及作废。内部模式显示成本毛利；对外模式只输出结算货品和金额。</li><li>新录入仍保存在当前浏览器，每天导出完整JSON备份；本版本历史资料内置，公开发布可被访问者读取。</li></ol></div>`);
 else if(action==='demo')confirmModal('切换到演示数据？','将先下载当前完整备份，然后使用虚构商品演示。请确认备份下载成功后，再恢复真实数据。',()=>{backup();const d=empty();d.meta={name:'演示',opening:'已核定'};d.products=[{code:'DEMO01',name:'演示 · 珍藏红葡萄酒',category:'红酒',spec:'750ml / 瓶',unit:'瓶',purchasePrice:180,salePrice:280,threshold:6}];d.transactions=[{id:'demo-in',seq:1,date:today(),type:'purchase',code:'DEMO01',qty:24,price:180,note:'虚构演示数据'},{id:'demo-sale',seq:2,date:today(),type:'sale',code:'DEMO01',qty:6,price:280,note:'虚构演示数据'},{id:'demo-self',seq:3,date:today(),type:'self',code:'DEMO01',qty:2,price:180,note:'虚构演示数据'}];if(commit(d,'加载虚构演示数据')){month=today().slice(0,7);render();toast('当前为虚构演示，恢复真实JSON可切回。');}});
});
document.addEventListener('change',e=>{if(e.target.id==='month'){month=e.target.value;render();}else if(e.target.id==='client'){client=e.target.value;render();}else if(e.target.id==='txType'){txType=e.target.value;render();}else if(e.target.id==='stockFilter'){stockFilter=e.target.value;render();}else if(e.target.id==='reportTab'){tab=e.target.value;render();}});
let searchTimer;document.addEventListener('input',e=>{if(e.target.id==='search'){const pos=e.target.selectionStart;search=e.target.value;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{render();const inp=$('#search');if(inp){inp.focus();inp.setSelectionRange(pos,pos);}},180);}});
$('#jsonFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>20*1024*1024)throw Error('文件超过20MB');const next=C.valid(JSON.parse(await f.text()));showModal('确认导入数据',`<p>检测到 <b>${next.products.length}</b> 个商品、<b>${next.transactions.length}</b> 笔流水、<b>${next.orders.length}</b> 张订单。</p><div class="notice wine">导入会整体替换当前数据。请先下载当前备份；不合并重复记录。</div><div class="formbuttons"><button data-action="backup">先下载当前备份</button><button id="acceptImport" class="primary">确认替换并导入</button></div>`);$('#acceptImport').onclick=()=>{if(commit(next,'导入完整数据 '+f.name)){closeModal();month='';search='';render();toast('导入成功。可切换月份查看历史报表。');}};}catch(err){toast('导入失败：'+err.message);}};
$('#csvFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const rows=parseCSV((await f.text()).replace(/^\ufeff/,''));if(rows[0]?.[6]==='三局参考价')rows[0][6]='默认销售参考价';const hdr=['商品编码','商品名称','类别','规格','单位','参考采购价','默认销售参考价','预警线'];if(JSON.stringify(rows.shift())!==JSON.stringify(hdr))throw Error('列名不匹配，请先导出商品CSV作为模板');const next=JSON.parse(JSON.stringify(data)),seen=new Set();for(const r of rows){if(r.length!==8)throw Error('列数必须为8');const code=r[0].trim();if(!/^[A-Za-z0-9_-]+$/.test(code)||seen.has(code))throw Error('编码无效或文件中重复');seen.add(code);if(next.products.some(p=>p.code===code))throw Error('编码 '+code+' 已存在，CSV仅用于新增商品');const numbers=r.slice(5).map(Number);if(numbers.some(n=>!Number.isFinite(n)||n<0))throw Error('价格或预警线不是有效数字');next.products.push({code,name:r[1].trim(),category:r[2].trim(),spec:r[3].trim(),unit:r[4].trim(),purchasePrice:numbers[0],salePrice:numbers[1],threshold:numbers[2],review:false});}C.valid(next);confirmModal('导入商品CSV？',`将新增 ${rows.length} 个商品，不修改现有档案。`,()=>{if(commit(next,'CSV新增商品')){render();toast('商品CSV已导入。');}});}catch(err){toast('CSV未导入：'+err.message);}};

function clients(){return heading('CUSTOMERS','客户档案','在这里新增客户、修改简称和对账单抬头。已有流水按固定客户ID关联，改名后历史报表同步显示新名称。','<button class="primary" data-action="clientEdit">＋ 新增客户</button>')+`<section class="card">${table(['显示名称','对账单抬头 / 全称','类型','默认账期','状态','操作'],data.clients.map(c=>`<tr><td><b>${esc(c.name)}</b><small>${esc(c.id)}</small></td><td>${esc(c.fullName||c.name)}</td><td>${c.kind==='self'?'内部自用':'销售客户'}</td><td>${c.termMonths}个月</td><td>${pill(c.active===false?'已停用':'使用中',c.active===false?'':'green')}</td><td><button data-action="clientEdit" data-id="${esc(c.id)}">编辑 / 改名</button></td></tr>`))}</section><div class="notice">例如添加「中建五局」，保存后会自动出现在销售录单、待提货订单、月度统计和对账的客户下拉框中。停用客户不删除历史记录。</div>`;}
function clientModal(id){const c=data.clients.find(c=>c.id===id)||{name:'',fullName:'',kind:'customer',termMonths:3,active:true};showModal(id?'修改客户资料':'新增客户',`<form id="clientForm"><div class="fieldgrid"><div class="field"><label for="cname">显示名称 / 简称</label><input id="cname" name="name" value="${esc(c.name)}" maxlength="80" required placeholder="例如：中建五局"></div><div class="field"><label for="ckind">客户类型</label><select id="ckind" name="kind" ${id?'disabled':''}><option value="customer" ${c.kind==='customer'?'selected':''}>销售客户</option><option value="self" ${c.kind==='self'?'selected':''}>内部自用</option></select></div><div class="field full"><label for="cfull">对账单抬头 / 全称</label><input id="cfull" name="fullName" value="${esc(c.fullName)}" maxlength="150" placeholder="打印和对外导出时使用"></div><div class="field"><label for="cterm">默认账期（月）</label><input id="cterm" name="termMonths" type="number" value="${c.termMonths}" min="0" max="120" step="1" required></div><div class="field"><label for="cactive">使用状态</label><select id="cactive" name="active"><option value="yes" ${c.active!==false?'selected':''}>使用中</option><option value="no" ${c.active===false?'selected':''}>停用，仅保留历史</option></select></div></div><div class="formbuttons"><button class="primary">保存客户</button></div></form>`);$('#clientForm').onsubmit=e=>{e.preventDefault();const f=e.target.elements,v={id:id||'c_'+uid(),name:f.name.value.trim(),fullName:f.fullName.value.trim(),kind:c.kind&&id?c.kind:f.kind.value,termMonths:+f.termMonths.value,active:f.active.value==='yes'};if(!v.name)return toast('请输入客户名称');if(data.clients.some(x=>x.id!==v.id&&x.name===v.name))return toast('名称已存在，请使用不同简称');if(mutate(d=>{const i=d.clients.findIndex(x=>x.id===v.id);if(i>=0)d.clients[i]=v;else d.clients.push(v);},'保存客户 '+v.name)){closeModal();render();toast('客户已保存，全部选择框和报表已更新。');}};}

function entryForm(defaults={}){return `<form id="entryForm"><div class="fieldgrid"><div class="field"><label for="entryDate">业务日期</label><input id="entryDate" name="date" type="date" value="${defaults.date||today()}" required></div><div class="field"><label for="entryType">业务类型</label><select id="entryType" name="type">${Object.entries(C.TYPES).map(([k,v])=>`<option value="${k}" ${(defaults.type||txType||'purchase')===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="field full" id="entryClientWrap"><label for="entryClient">销售客户 / 领用方</label><select id="entryClient" name="clientId"></select><small>客户名称在左侧「客户档案」中新增或修改。</small></div><div class="field full"><label for="entryProduct">商品编码 / 商品名称</label><select id="entryProduct" name="query" required><option value="">请下拉选择商品编码与名称</option>${data.products.slice().sort((a,b)=>a.code.localeCompare(b.code)).map(p=>`<option value="${esc(p.code)}">${esc(p.code)} · ${esc(p.name)} · ${esc(p.unit)}</option>`).join('')}</select></div><div class="field full" id="originalWrap" hidden><label for="entryOriginal">原始单据（仅显示所选客户）</label><select id="entryOriginal" name="original"></select></div></div><div id="productPreview" class="productpreview"><strong>等待选择商品</strong><p>基础资料自动带出。</p></div><div class="fieldgrid"><div class="field"><label for="entryQty">本次数量（基础单位）</label><input id="entryQty" name="qty" type="number" min="0.001" step="0.001" required></div><div class="field"><label for="entryPrice">本次单价（元）</label><input id="entryPrice" name="price" type="number" min="0" step="any" required><small id="priceHint"></small></div><div class="field full"><label for="entryNote">备注（选填）</label><textarea id="entryNote" name="note" rows="2" maxlength="300"></textarea></div></div><div class="amountbox"><span>本笔记录金额</span><strong id="entryAmount">¥ 0.00</strong></div><div class="formbuttons"><button type="submit" class="primary" name="mode" value="keep">保存并继续录入</button><button type="submit" name="mode" value="done">保存并查看流水</button></div></form>`;}
function bindEntry(form){
 const el=n=>form.elements[n];let dirty=false;
 function amount(){$('#entryAmount').textContent='¥ '+money((+el('qty').value||0)*(+el('price').value||0));}
 function setClient(){const type=el('type').value,purchase=type.startsWith('purchase'),kind=type.startsWith('self')?'self':'customer',old=el('clientId').value;$('#entryClientWrap').hidden=purchase;el('clientId').required=!purchase;el('clientId').innerHTML=clientOptions(kind,old,false,type.endsWith('Return'));if([...el('clientId').options].some(o=>o.value===old))el('clientId').value=old;}
 function update(reset=true){const p=selectedProduct(form),type=el('type').value,ret=type.endsWith('Return'),cid=type.startsWith('purchase')?'':el('clientId').value;$('#originalWrap').hidden=!ret;el('original').required=ret;
  if(!p){$('#productPreview').innerHTML='<strong>请选择商品编码</strong><p>展开下拉框即可选择，无需手输编码。</p>';el('price').value='';el('original').innerHTML='<option value="">请先选商品</option>';amount();return;}
  const s=C.calc(data,el('date').value).stocks[p.code];$('#productPreview').innerHTML=`<strong>${esc(p.name)}</strong><p>${esc(p.code)} · ${esc(p.spec||'规格待补充')} · ${esc(p.unit)}</p><p>当日实物库存 ${num(s.qty)} ${esc(p.unit)} / 可用 ${num(s.available)} ${esc(p.unit)}${p.review?' · 商品信息待核对':''}</p>`;
  if(ret){const typ={saleReturn:'sale',selfReturn:'self',purchaseReturn:'purchase'}[type],prev=el('original').value;el('original').innerHTML='<option value="">请选择原单</option>'+data.transactions.filter(t=>!t.void&&t.code===p.code&&t.type===typ&&t.date<=el('date').value&&(!cid||t.clientId===cid)).map(t=>{const returned=data.transactions.filter(r=>!r.void&&r.original===t.id).reduce((a,r)=>a+r.qty,0);return `<option value="${esc(t.id)}">${t.date} · #${t.seq} · 可退 ${num(t.qty-returned)} ${esc(p.unit)} · ¥${money(t.price)}</option>`;}).join('');if([...el('original').options].some(o=>o.value===prev))el('original').value=prev;const orig=data.transactions.find(t=>t.id===el('original').value);el('price').value=orig?.price??'';el('price').readOnly=true;$('#priceHint').textContent='单价沿用所选客户原单。';}
  else{el('price').readOnly=type==='self';if(reset)el('price').value=type==='self'?Math.max(0,s.avg).toFixed(6):C.priceAt(data,p.code,type,el('date').value,cid);$('#priceHint').textContent=type==='self'?'自用按当日现有流水成本暂算。':type==='purchase'?'参考最近采购价，请核实本次实际进价。':'优先读取该客户最近成交价；无历史时使用商品参考价，可修改。';}amount();
 }
 el('query').onchange=()=>{dirty=false;update();};el('type').onchange=()=>{dirty=false;setClient();update();};el('clientId').onchange=()=>{dirty=false;el('original').value='';update();};el('date').onchange=()=>update(!dirty);el('original').onchange=()=>update();el('qty').oninput=amount;el('price').oninput=()=>{dirty=true;amount();};
 form.onsubmit=e=>{e.preventDefault();const p=selectedProduct(form);if(!p)return toast('请先下拉选择商品。');const type=el('type').value,date=el('date').value,qty=+el('qty').value,price=+el('price').value,cid=type.startsWith('purchase')?'':el('clientId').value,original=el('original').value;if(date>today())return toast('实际流水不能使用未来日期。');if(!(qty>0)||!Number.isFinite(price)||price<0)return toast('数量或价格无效。');if(!type.startsWith('purchase')&&!cid)return toast('请先在客户档案中新增可用客户。');if(type.endsWith('Return')&&!original)return toast('请选择原始单据。');const stock=C.calc(data,date).stocks[p.code];if(C.sign(type)<0&&qty>stock.available+1e-8)return toast('可用库存不足，请核对库存和订单占用。');const orig=data.transactions.find(t=>t.id===original),t={id:uid(),seq:Math.max(0,...data.transactions.map(t=>t.seq))+1,date,type,code:p.code,qty,price,note:el('note').value.trim(),...(cid?{clientId:cid}:{}),...(type.endsWith('Return')?{original,...(orig?.orderId?{orderId:orig.orderId}:{})}:{})};const next=JSON.parse(JSON.stringify(data));next.transactions.push(t);if(!noNewShortages(data,next))return toast('补录会导致后续库存不足，请先核对历史。');if(commit(next,'新增'+C.TYPES[type]+' #'+t.seq)){toast('已保存，库存、月报及可对账流水已更新。');if(e.submitter?.value==='done')location.hash='inventory';else{el('query').value='';el('qty').value='';el('note').value='';update();el('query').focus();}}};setClient();update();
}

function beforeMonth(m){return new Date(Date.UTC(+m.slice(0,4),+m.slice(5)-1,0)).toISOString().slice(0,10);}
function monthlyRows(){const m=dateMonth(),start=C.calc(data,beforeMonth(m)).stocks,end=C.calc(data,m+'-31').stocks;return data.products.map(p=>{const tx=data.transactions.filter(t=>!t.void&&t.code===p.code&&t.date.startsWith(m)),sum=type=>tx.filter(t=>t.type===type).reduce((a,t)=>a+t.qty,0);return {p,opening:start[p.code].qty,purchase:sum('purchase'),purchaseReturn:sum('purchaseReturn'),sale:sum('sale'),saleReturn:sum('saleReturn'),self:sum('self'),selfReturn:sum('selfReturn'),closing:end[p.code].qty,count:tx.length};}).filter(x=>x.count||x.opening||x.closing);}
function reportSelection(){return C.report(data,dateMonth(),reportScope,reportClient||undefined);}
function reports(){const m=dateMonth(),p=C.report(data,m,'purchase'),s=C.report(data,m,'sale'),o=C.report(data,m,'self'),sum=a=>a.reduce((v,t)=>v+t.amount,0),scope=reportScope,overview=scope==='overview',rows=overview?[]:reportSelection(),title={overview:'月度进销存总览',purchase:'本月采购入库',out:'本月全部出库',sale:'客户销售出库',self:'老板 / 内部自用'}[scope];
 const filters=`<div class="toolbar">${monthInput()}<select id="reportScope" aria-label="月度统计范围">${Object.entries({overview:'总览 · 入库与出库',purchase:'入库 · 本月采购',out:'出库 · 全部对象',sale:'出库 · 客户销售',self:'出库 · 老板自用'}).map(([k,v])=>`<option value="${k}" ${scope===k?'selected':''}>${v}</option>`).join('')}</select>${!overview&&scope!=='purchase'?`<select id="reportCustomer" aria-label="筛选客户">${clientOptions(scope==='self'?'self':scope==='sale'?'customer':'',reportClient,true)}</select>`:''}${!overview?`<select id="reportTab" aria-label="明细或汇总"><option value="detail" ${tab==='detail'?'selected':''}>逐笔明细</option><option value="summary" ${tab==='summary'?'selected':''}>按商品汇总</option></select>`:''}<span class="spacer"></span><button data-action="reportCSV">导出本表 CSV</button><button class="primary" data-action="print">打印 / 存PDF</button></div>`;
 const groups={};for(const t of rows){const a=groups[t.code]||(groups[t.code]={code:t.code,qty:0,amount:0});a.qty+=t.net;a.amount+=t.amount;}
 const body=overview?table(['商品 / 编码','单位','期初数量','采购入库','采购退货','客户出库','客户退回','自用出库','自用退回','期末数量'],monthlyRows().map(x=>`<tr><td>${esc(x.p.name)}<small>${esc(x.p.code)}</small></td><td>${esc(x.p.unit)}</td>${['opening','purchase','purchaseReturn','sale','saleReturn','self','selfReturn','closing'].map(k=>`<td>${num(x[k])}</td>`).join('')}</tr>`)):tab==='detail'?table(['日期','类型','客户 / 领用方','商品 / 编码','单位','净数量','记录单价','净金额'],rows.map(t=>{const pr=product(t.code);return `<tr><td>${t.date}</td><td>${esc(C.TYPES[t.type])}</td><td>${t.clientId?esc(clientName(t.clientId)):'本月采购'}</td><td>${esc(pr.name)}<small>${esc(t.code)}</small></td><td>${esc(pr.unit)}</td><td>${num(t.net)}</td><td>${money(t.price)}</td><td class="amount">${money(t.amount)}</td></tr>`;})):table(['商品 / 编码','单位','净数量','净金额'],Object.values(groups).map(g=>`<tr><td>${esc(product(g.code).name)}<small>${esc(g.code)}</small></td><td>${esc(product(g.code).unit)}</td><td>${num(g.qty)}</td><td class="amount">${money(g.amount)}</td></tr>`));
 return heading('MONTHLY OPERATIONS','月度统计','同月查看采购入库与出库；客户名称由「客户档案」统一管理。')+filters+`<div class="stats">${stat('本月采购净入库额','¥ '+money(sum(p)),'采购入库 − 采购退货')}${stat('本月客户销售净额','¥ '+money(sum(s)),'销售出库 − 销售退回；不含对账价差')}${stat('本月自用记录净额','¥ '+money(sum(o)),'自用出库 − 自用退回')}${stat('本月全部出库记录净额','¥ '+money(sum(s)+sum(o)),'销售与自用合计，不等同销售收入')}</div>`+provisional()+`<section class="card"><div class="reportheader"><div><div class="eyebrow">HONGSHENG / MONTHLY OPERATIONS</div><h2>${esc(m+' '+title)}${reportClient&&!overview&&scope!=='purchase'?' · '+esc(clientName(reportClient)):''}</h2><p class="sub">${overview?'各商品按自己的基础单位计算，数量不跨单位相加。':'退回按负数量、负金额抵减。'}</p></div></div>${body}${!overview?`<div class="amountbox"><span>${rows.length}笔 · ${Object.keys(groups).length}种商品</span><strong>¥ ${money(sum(rows))}</strong></div>`:''}<p class="sub" style="margin-top:16px">数据口径：仅来自有效出入库流水。对账单独立保存，不再次计入采购或销售。${reportClient?'客户抬头：'+esc(clientName(reportClient,true)):''}</p></section>`;
}
function exportReport(){if(reportScope==='overview'){csv(dateMonth()+'_月度进销存.csv',[['商品编码','商品名称','单位','期初数量','采购入库','采购退货','客户出库','客户退回','自用出库','自用退回','期末数量'],...monthlyRows().map(x=>[x.p.code,x.p.name,x.p.unit,x.opening,x.purchase,x.purchaseReturn,x.sale,x.saleReturn,x.self,x.selfReturn,x.closing])]);return;}const rows=reportSelection();if(tab==='summary'){const g={};for(const t of rows){const a=g[t.code]||(g[t.code]={qty:0,amount:0});a.qty+=t.net;a.amount+=t.amount;}csv(dateMonth()+'_'+reportScope+'_汇总.csv',[['商品编码','商品名称','单位','净数量','净金额'],...Object.entries(g).map(([code,v])=>[code,product(code).name,product(code).unit,v.qty,C.round(v.amount)])]);}else csv(dateMonth()+'_'+reportScope+'_明细.csv',[['日期','类型','客户','编码','商品','单位','净数量','单价','净金额'],...rows.map(t=>[t.date,C.TYPES[t.type],t.clientId?clientName(t.clientId):'采购',t.code,product(t.code).name,product(t.code).unit,t.net,t.price,t.amount])]);}

function orders(){const active=data.orders.filter(o=>!o.void);return heading('PICKUP ORDERS','待提货管理','客户从档案中选择。订货占用可用库存，实际提货生成该客户销售出库。','<button class="primary" data-action="order">＋ 新建待提货订单</button>')+`<section class="card">${table(['订货日期 / 编号','客户','商品','订货数量','已提净数量','剩余未提','结算单价','操作'],active.map(o=>{const d=C.delivered(data,o.id),p=product(o.code);return `<tr><td>${o.date}<small>${esc(o.id.slice(-8))}</small></td><td>${esc(clientName(o.clientId))}</td><td>${esc(p.name)}</td><td>${num(o.qty)} ${esc(p.unit)}</td><td>${num(d)}</td><td>${pill(num(o.qty-d),o.qty>d?'red':'green')}</td><td>${money(o.price)}</td><td>${o.qty>d?`<button data-action="fulfill" data-id="${esc(o.id)}">登记提货</button>`:pill('已提完','green')} <button data-action="cancelOrder" data-id="${esc(o.id)}">关闭订单</button></td></tr>`;}))}</section><div class="notice">对账在左侧「对账中心」中管理；新提货单可直接被对账单引用。原表历史订货与实际提货关系尚未自动迁移。</div>`;}
function orderModal(){showModal('新建待提货订单',`<form id="orderForm"><div class="fieldgrid"><div class="field"><label for="odate">订货日期</label><input id="odate" name="date" type="date" value="${today()}" required></div><div class="field"><label for="oclient">客户</label><select id="oclient" name="clientId" required>${clientOptions()}</select></div><div class="field full"><label for="ocode">商品编码</label><select id="ocode" name="code" required><option value="">请选择商品</option>${data.products.map(p=>`<option value="${esc(p.code)}">${esc(p.code+' · '+p.name)}</option>`).join('')}</select></div><div class="field"><label for="oqty">订货数量</label><input id="oqty" name="qty" type="number" min="0.001" step="0.001" required></div><div class="field"><label for="oprice">结算单价</label><input id="oprice" name="price" type="number" min="0" step="any" required></div></div><div class="formbuttons"><button class="primary">保存订单</button></div></form>`);const f=$('#orderForm'),price=()=>f.elements.price.value=C.priceAt(data,f.elements.code.value,'sale',f.elements.date.value,f.elements.clientId.value);f.elements.code.onchange=price;f.elements.clientId.onchange=price;f.elements.date.onchange=price;f.onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(f)),o={...v,id:uid(),qty:+v.qty,price:+v.price};if(o.date>today())return toast('订货日期不能晚于今天。');const n=JSON.parse(JSON.stringify(data));n.orders.push(o);if(!noNewShortages(data,n))return toast('库存不足，不能占用。');if(commit(n,'新增客户待提货订单')){closeModal();render();toast('已保存订单。');}};}
function fulfillModal(id){const o=data.orders.find(o=>o.id===id),p=product(o.code),remaining=o.qty-C.delivered(data,id);showModal('登记实际提货',`<form id="fulfillForm"><div class="productpreview"><strong>${esc(clientName(o.clientId))} · ${esc(p.name)}</strong><p>剩余 ${num(remaining)} ${esc(p.unit)} · ¥${money(o.price)}</p></div><div class="fieldgrid"><div class="field"><label for="fdate">提货日期</label><input id="fdate" name="date" type="date" min="${o.date}" max="${today()}" value="${today()}" required></div><div class="field"><label for="fqty">本次提货数量</label><input id="fqty" name="qty" type="number" min="0.001" max="${remaining}" step="0.001" required></div></div><div class="formbuttons"><button class="primary">确认提货并生成出库</button></div></form>`);$('#fulfillForm').onsubmit=e=>{e.preventDefault();const f=e.target.elements,n=JSON.parse(JSON.stringify(data));n.transactions.push({id:uid(),seq:Math.max(0,...data.transactions.map(t=>t.seq))+1,date:f.date.value,type:'sale',clientId:o.clientId,code:o.code,qty:+f.qty.value,price:o.price,orderId:id,note:'客户订单实际提货'});if(!noNewShortages(data,n))return toast('库存不足。');if(commit(n,'订单实际提货')){closeModal();render();toast('已生成该客户出库。');}};}

 `<section class="card"><h2>本次更新口径</h2><p>主流水由448笔补齐到459笔，新增11笔；10月补入销售 ¥420.00，11月补入采购 ¥28,800.00、销售 ¥38,270.00。对账中心按原表合并分组重新生成200组，实际242行、结算188行；结算侧不扣库存。</p><p class="muted">本机新增及修改记录继续保留。更新前的浏览器数据已另存本机备份；可用下方按钮导出。请勿清理浏览器存储。</p><button data-action="preUpdateBackup">导出更新前备份</button></section>`;
}
document.addEventListener('change',e=>{if(e.target.id==='sourceSheet'){sourceSheet=e.target.value;render();}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;
 if(b.dataset.action==='preUpdateBackup'){const v=localStorage.getItem(KEY+'-before-20261108');if(v)download('Hongsheng_Before_20261108.json',v,'application/json');else toast('当前浏览器没有旧版数据；首次打开直接使用最新内置记录。');}
 if(b.dataset.action==='sourceExport'){const s=data.sourceSnapshots?.find(x=>x.name===sourceSheet);if(!s)return;const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';download('原表-'+s.name+'.csv','\ufeff'+s.rows.map(r=>[r.row,...r.cells].map(quote).join(',')).join('\r\n'),'text/csv;charset=utf-8');}
});

function settings(){return `<section class="card"><h2>11月8日数据更新</h2><p>内置459笔主流水，200组对账。旧浏览器自动补齐并去重，本机修改保留。</p><a href="#sourceRecords"><button>查看原表与更新核对 →</button></a></section><section class="card"><div class="cardhead"><div><h2>客户名称与对账单抬头</h2><p class="sub">「中建三局」可修改，也可新增中建五局等独立客户；请到左侧「客户档案」。</p></div><a href="#clients"><button>管理客户 →</button></a></div></section>`+legacySettings();}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]'),rb=e.target.closest('[data-rec-action]');if(rb){e.preventDefault();reconciliationButton(rb);return;}if(!b)return;const a=b.dataset.action,id=b.dataset.id;if(a==='clientEdit')clientModal(id);if(a==='recNew')openReconciliation();if(a==='recEdit')openReconciliation(id);if(a==='recCSV')recExport();if(a==='recUnlock')confirmModal('撤回对账确认？','保留原明细和操作记录，撤回后可修改。',()=>{if(mutate(d=>d.reconciliations.find(r=>r.id===id).confirmed=false,'撤回对账确认'))render();});if(a==='recVoid')confirmModal('作废该对账单？','只作废对账快照，不撤销实际出库，不改库存。原记录仍在备份中保留。',()=>{if(mutate(d=>d.reconciliations.find(r=>r.id===id).void=true,'作废对账单'))render();});});
document.addEventListener('change',e=>{const id=e.target.id;if(id==='reportScope'){reportScope=e.target.value;reportClient='';render();}if(id==='reportCustomer'){reportClient=e.target.value;render();}if(id==='recMonth'){recMonth=e.target.value;render();}if(id==='recClient'){recClient=e.target.value;render();}if(id==='recView'){recView=e.target.value;render();}if(id==='recDiff'){recDiff=e.target.checked;render();}});

let dashboardMode='month',dashboardYear=today().slice(0,4);
function overviewFilters(){
 const years=[...new Set([+today().slice(0,4),+dashboardYear,...data.transactions.map(t=>+t.date.slice(0,4)),...Array.from({length:5},(_,i)=>+today().slice(0,4)-i)])].sort((a,b)=>b-a);
 return `<div class="toolbar" style="margin:0"><select id="dashboardMode" aria-label="概览统计范围"><option value="month" ${dashboardMode==='month'?'selected':''}>按月份</option><option value="year" ${dashboardMode==='year'?'selected':''}>本年 / 按年份累计</option></select>${dashboardMode==='month'?monthInput():`<select id="dashboardYear" aria-label="累计年份">${years.map(y=>`<option value="${y}" ${String(y)===dashboardYear?'selected':''}>${y}年${String(y)===today().slice(0,4)?'（本年）':''}</option>`).join('')}</select>`}<button data-action="currentYear">本年累计</button><button data-action="overviewExport">导出年度核对</button></div>`;
}
function annualCards(year){
 const range=C.periodRange('year',year,'',today()),s=C.periodSummary(data,range.start,range.end);
 return `<section class="card"><div class="cardhead"><div><h2>${esc(year)}年累计</h2><p class="sub" style="margin-bottom:0">${range.start} 至 ${range.end} · 退回已抵减</p></div><button data-action="yearForMonth">查看该年度明细</button></div><div class="stats">${stat('全年采购净入库额','¥ '+money(s.purchase),'采购流水口径')}${stat('全年销售净出库额','¥ '+money(s.sale),'实物流转口径')}${stat('全年老板自用净额','¥ '+money(s.self),'自用单独列示')}${stat('全年对账应结算额','¥ '+money(s.settlement),'对账结算口径，不能与销售重复相加')}</div></section>`;
}
function overviewComparison(year){
 const rows=C.monthComparison(data,year,today()),numcell=n=>n===null?'—（原表未填）':'¥ '+money(n),total=k=>C.round(rows.reduce((a,r)=>a+(r[k]||0),0));
 return `<section class="card"><div class="cardhead"><div><h2>${esc(year)}年 · 每月金额核对</h2><p class="sub">出库日期与对账日期分别统计，金额均已扣减退回；点击月份可回到当月概览。</p></div><a href="#sourceRecords">查看原表 →</a></div>`+
 table(['月份','销售净出库①','对账实际侧②','日期/明细差额②−①','对账结算侧③','结算价差③−②','结算统计表应收④','③−④'],rows.map(r=>`<tr><td><button data-action="overviewMonth" data-month="${r.month}">${r.month}</button></td>${[r.sale,r.actual,r.actualGap,r.settlement,r.difference,r.sourceReceivable,r.sourceGap].map((n,i)=>`<td class="amount" ${[2,4,6].includes(i)&&n?'style="color:#a33a34;background:#fff1e9"':''}>${numcell(n)}</td>`).join('')}</tr>`).concat(`<tr><td><b>全年合计</b></td>${['sale','actual','actualGap','settlement','difference','sourceReceivable','sourceGap'].map(k=>`<td class="amount"><b>¥ ${money(k==='sourceGap'?total('settlement')-total('sourceReceivable'):total(k))}</b></td>`).join('')}</tr>`))+
 `<div class="notice">销售净出库与对账应结算的差额，先看“日期/明细差额”，再看“结算价差”。结算统计表未填写的月份保留空白，不当作0。年度差额按两侧全年合计相减。</div>`+
 (year==='2026'?`<div class="notice wine">已定位：两笔合计 ¥16,800.00 的货品，主流水记为2026-09-01（茅台¥12,600、红爆珠¥4,200），对账实际侧记为2026-08-30（同货品、数量与金额）。因此8月实际侧比主流水多¥16,800，9月少¥16,800，全年抵销。日期需核实，当前保留原表各自日期。</div>`:'')+'</section>';
}
function dashboard(){
 const m=dateMonth(),year=dashboardMode==='year'?dashboardYear:m.slice(0,4),r=C.periodRange(dashboardMode,year,m,today()),sum=C.periodSummary(data,r.start,r.end),s=C.calc(data,r.end).stocks;
 const low=data.products.filter(p=>s[p.code]?.available<=p.threshold),recent=data.transactions.filter(t=>!t.void&&t.date>=r.start&&t.date<=r.end).slice().sort((a,b)=>b.date.localeCompare(a.date)||b.seq-a.seq).slice(0,8);
 const chart=C.monthComparison(data,year,today()),max=Math.max(1,...chart.flatMap(x=>[Math.abs(x.sale),Math.abs(x.settlement)]));
 return `<section class="hero"><div><div class="eyebrow">HONGSHENG / DAILY OPERATIONS</div><h1>每一笔流转，<br>都有清晰的去向。</h1><p>采购 · 销售 · 自用 · 对账，按月与按年查看</p><button data-action="new">＋ 记录一笔出入库　↗</button></div><div class="heroArt" aria-hidden="true"><div class="bottle"></div><div class="yearmark">THE CELLAR / ${esc(year)}</div></div></section>`+
 `<section class="card"><div class="cardhead" style="flex-wrap:wrap"><div><h2>经营概览 · ${esc(r.label)}</h2><p class="sub" style="margin:4px 0">${r.start} 至 ${r.end} · ${sum.count}笔主流水 · ${sum.recCount}组对账</p></div>${overviewFilters()}</div><h3>出入库流水金额</h3><div class="stats">${stat('采购净入库额','¥ '+money(sum.purchase),'采购入库 − 采购退货')}${stat('销售净出库额','¥ '+money(sum.sale),'销售出库 − 销售退回')}${stat('老板自用净额','¥ '+money(sum.self),'自用出库 − 自用退回')}${stat('全部净出库记录额','¥ '+money(sum.out),'销售 + 自用，不等同销售收入')}</div><h3>对账与回款金额</h3><div class="stats">${stat('对账实际出库侧','¥ '+money(sum.actual),'按对账业务日期')}${stat('对账应结算额','¥ '+money(sum.settlement),'实际侧 + 结算价差')}${stat('结算价差','¥ '+money(sum.difference),'应结算额 − 实际侧')}${stat('附件记录回款','¥ '+money(sum.payments),'按付款备注中的实际付款日期')}</div><p class="sub">销售净出库额用于核对实物流转；对账应结算额用于核对应收。两者各自列示，不能重复相加；原表成本与利润在对账中心查看。</p></section>`+
 (dashboardMode==='month'?annualCards(year):'')+
 (year==='2026'?`<section class="card"><h2>2026年 · 结算统计表原值</h2><div class="stats">${stat('原表累计应收','¥ 986,178.00','结算统计表：11月应收未填')}${stat('原表累计已结算','¥ 538,500.00','10月22日250,000 + 10月30日288,500')}${stat('原表累计待结算','¥ 447,678.00','986,178 − 538,500')}${stat('与最新对账累计差额','¥ '+money(C.periodSummary(data,'2026-01-01','2026-12-31').settlement-986178),'最新对账累计 − 原表累计应收')}</div><p class="sub">以上为附件保存的全年结算原值，不随月份筛选变更。尚未把新对账金额自动写入原表应收，避免伪造已核对结算。</p></section>`:'')+
 overviewComparison(year)+
 `<section class="card"><h2>${esc(year)}年 · 销售流水与对账应结算</h2><div class="barchart">${chart.map(x=>`<div class="bargroup"><div class="bar" style="height:${Math.abs(x.sale)/max*100}%" title="${x.month} 销售净额 ${money(x.sale)}"></div><div class="bar peach" style="height:${Math.abs(x.settlement)/max*100}%" title="${x.month} 对账应结算 ${money(x.settlement)}"></div><label>${x.month.slice(5)}月</label></div>`).join('')}</div><div class="legend"><span><i></i>销售净出库</span><span><i class="light"></i>对账应结算</span></div></section>`+
 provisional()+`<div class="grid2"><section class="card"><div class="cardhead"><h2>所选期间 · 最近流水</h2><a href="#inventory">查看流水 →</a></div>${table(['日期 / 类型','商品','净数量','净金额'],recent.map(t=>`<tr><td>${esc(t.date)}<br>${kind(t.type)}</td><td>${esc(product(t.code)?.name)}<small>${esc(t.code)}</small></td><td>${num(t.qty*(t.type.endsWith('Return')?-1:1))} ${esc(product(t.code)?.unit)}</td><td class="amount">${money(C.ledgerAmount(t))}</td></tr>`))}</section><section class="card"><h2>期末库存提醒</h2><p class="sub">库存截至 ${r.end}，库存数量不跨单位相加。</p>${low.slice(0,5).map(p=>`<div class="issue"><b>${esc(p.name)}</b><p>可用 ${num(s[p.code].available)} ${esc(p.unit)}</p></div>`).join('')||'<p>暂无预警。</p>'}<a href="#inventory">查看库存 →</a></section></div>`;
}
document.addEventListener('change',e=>{if(e.target.id==='dashboardMode'){dashboardMode=e.target.value;dashboardYear=dateMonth().slice(0,4);render();}if(e.target.id==='dashboardYear'){dashboardYear=e.target.value;render();}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
 if(a==='currentYear'){dashboardMode='year';dashboardYear=today().slice(0,4);render();}

});

load();$('#today').textContent=new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'short'});page=location.hash.slice(1)||'dashboard';render();
