<body><div class="app"><aside><a class="brand" href="#dashboard"><span class="brandmark">宏</span><span>宏盛酒庄<small>HONGSHENG · ATELIER</small></span></a><div class="navcaption">日常经营 / WORKSPACE</div><nav id="nav"></nav><div class="sidebottom"><div class="statusdot"></div><b>本机数据工作区</b><p>录入即计算 · 自动保存在当前浏览器</p><button class="ghost" data-action="backup">↓ 导出完整备份</button><small>Developer · Rachel Hu</small></div></aside><div class="main"><header><button id="menutoggle" aria-label="展开导航">☰</button><div id="breadcrumb">经营概览</div><div class="headerRight"><span id="saved">本机存储</span><span id="today"></span><button class="primary" data-action="new">＋ 快速录单</button></div></header><main id="content"></main><footer>宏盛酒庄 · 库存与经营工作台 <span>本机版 v1.0 · 数据不会自动上传至 GitHub</span></footer></div></div><dialog id="modal"><div class="dialogtop"><h2 id="modalTitle"></h2><button id="closeModal" aria-label="关闭">×</button></div><div id="modalBody"></div></dialog><div id="toast" role="status" aria-live="polite"></div><input hidden type="file" id="jsonFile" accept=".json,application/json"><input hidden type="file" id="csvFile" accept=".csv,text/csv"><script>(function(root){
'use strict';
const TYPES={purchase:'采购入库',sale:'三局出库',self:'老板自用',saleReturn:'三局退回',selfReturn:'自用退回',purchaseReturn:'采购退货'};
const sign=t=>['purchase','saleReturn','selfReturn'].includes(t)?1:-1;
const round=n=>Math.round((n+Number.EPSILON)*100)/100;
function calc(data,until='9999-12-31'){
 const stocks=Object.fromEntries(data.products.map(p=>[p.code,{qty:0,value:0,avg:0,uncertain:!!p.review}]));
 const costs={}, processed={};
 const rows=data.transactions.filter(t=>!t.void&&t.date<=until).sort((a,b)=>a.date.localeCompare(b.date)||a.seq-b.seq);
 for(const t of rows){
  const s=stocks[t.code];if(!s)continue;
  if(t.qty===0){costs[t.id]=0;processed[t.id]=t;continue;}
  const before=s.qty;let unit=s.avg;
  if(t.type==='purchase')unit=t.price;
  else if(t.original&&processed[t.original]?.qty>0)unit=costs[t.original]/processed[t.original].qty;
  else if(t.type.endsWith('Return'))s.uncertain=true;
  costs[t.id]=unit*t.qty;processed[t.id]=t;
  s.qty+=sign(t.type)*t.qty;s.value+=sign(t.type)*t.qty*unit;
  if(t.review||s.qty< -0.000001||before<0)s.uncertain=true;
  if(Math.abs(s.qty)<1e-8){s.qty=0;s.value=0;}
  s.avg=s.qty>0?s.value/s.qty:0;
 }
 for(const p of data.products){const s=stocks[p.code];s.reserved=data.orders.filter(o=>!o.void&&o.code===p.code&&o.date<=until).reduce((sum,o)=>sum+Math.max(0,o.qty-delivered(data,o.id,until)),0);s.available=s.qty-s.reserved;}
 return {stocks,costs};
}
function delivered(data,id,until='9999-12-31'){return data.transactions.filter(t=>!t.void&&t.orderId===id&&t.date<=until).reduce((a,t)=>a+(t.type==='sale'?t.qty:t.type==='saleReturn'?-t.qty:0),0);}
function priceAt(data,code,type,date){
 const rows=data.transactions.filter(t=>!t.void&&t.code===code&&t.type===type&&t.date<=date).sort((a,b)=>b.date.localeCompare(a.date)||b.seq-a.seq);
 const p=data.products.find(p=>p.code===code);return rows[0]?.price??(type==='purchase'?p?.purchasePrice:type==='sale'?p?.salePrice:0)??0;
}
function report(data,month,client){
 const end=month+'-31',c=calc(data,end),types=client==='sale'?['sale','saleReturn']:['self','selfReturn'];
 return data.transactions.filter(t=>!t.void&&t.date.startsWith(month)&&types.includes(t.type)).sort((a,b)=>a.date.localeCompare(b.date)||a.seq-b.seq).map(t=>({...t,net:t.qty*(t.type.endsWith('Return')?-1:1),amount:round(t.qty*t.price*(t.type.endsWith('Return')?-1:1)),cost:round((c.costs[t.id]||0)*(t.type.endsWith('Return')?-1:1)),uncertain:c.stocks[t.code]?.uncertain}));
}
function valid(data){
 if(!data||data.schema!==1||!Array.isArray(data.products)||!Array.isArray(data.transactions)||!Array.isArray(data.orders)||!Array.isArray(data.issues)||!data.meta||typeof data.meta!=='object'||!Array.isArray(data.audit))throw Error('文件不是本工作台的数据备份');
 const codes=new Set(),ids=new Set(),seqs=new Set();
 for(const p of data.products){if(!p.code||typeof p.code!=='string'||!/^[A-Za-z0-9_-]+$/.test(p.code)||['__proto__','constructor','prototype'].includes(p.code)||typeof p.name!=='string'||!p.name||typeof p.unit!=='string'||!p.unit||codes.has(p.code)||!Number.isFinite(p.threshold)||p.threshold<0||['purchasePrice','salePrice'].some(k=>p[k]!==undefined&&(!Number.isFinite(p[k])||p[k]<0)))throw Error('商品资料缺失、重复或价格预警值不正确');codes.add(p.code);}
 const dateOK=d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&!isNaN(Date.parse(d))&&new Date(d).toISOString().slice(0,10)===d;
 for(const t of data.transactions){if(typeof t.id!=='string'||!t.id||ids.has(t.id)||!codes.has(t.code)||!Object.hasOwn(TYPES,t.type)||!dateOK(t.date)||!Number.isFinite(t.qty)||t.qty<0||!Number.isFinite(t.price)||t.price<0||!Number.isFinite(t.seq)||seqs.has(t.seq))throw Error('流水字段无效、编号重复或引用商品缺失');ids.add(t.id);seqs.add(t.seq);}
 const orderIds=new Set();for(const o of data.orders){if(!o.id||orderIds.has(o.id)||!codes.has(o.code)||!dateOK(o.date)||!Number.isFinite(o.qty)||o.qty<=0||!Number.isFinite(o.price)||o.price<0)throw Error('提货订单格式错误');orderIds.add(o.id);}
 const tx=Object.fromEntries(data.transactions.map(t=>[t.id,t]));
 for(const t of data.transactions){if(t.original){const orig=tx[t.original];const match={saleReturn:'sale',selfReturn:'self',purchaseReturn:'purchase'};if(!orig||orig.code!==t.code||match[t.type]!==orig.type||t.date<orig.date||(!t.void&&orig.void))throw Error('退回流水与原单不匹配');}if(t.orderId&&!orderIds.has(t.orderId))throw Error('提货订单不存在');}
 for(const t of data.transactions.filter(t=>!t.void&&!t.type.endsWith('Return'))){if(data.transactions.filter(r=>!r.void&&r.original===t.id).reduce((a,r)=>a+r.qty,0)>t.qty+1e-8)throw Error('退回数量超过原单');}
 for(const o of data.orders){if(delivered(data,o.id)>o.qty+1e-8)throw Error('提货数量超过订单');}
 return data;
}
const api={TYPES,sign,round,calc,report,priceAt,delivered,valid};root.WineCore=api;if(typeof module!=='undefined')module.exports=api;
})(typeof window!=='undefined'?window:globalThis);

function commit(next,action){try{C.valid(next);next.audit=Array.isArray(next.audit)?next.audit:[];next.audit.push({time:new Date().toISOString(),action});localStorage.setItem(KEY,JSON.stringify(next));data=next;storageOK=true;$('#saved').textContent='已保存 · '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});$('#saved').classList.remove('savedbad');return true;}catch(e){toast('未保存：'+e.message);$('#saved').textContent='保存失败 · 请备份';$('#saved').classList.add('savedbad');storageOK=false;return false;}}
function mutate(fn,action){const next=JSON.parse(JSON.stringify(data));fn(next);return commit(next,action);}
const product=code=>data.products.find(p=>p.code===code);
const pill=(text,cls='')=>`<span class="pill ${cls}">${esc(text)}</span>`;
const kind=t=>pill(C.TYPES[t],t==='purchase'?'green':t.endsWith('Return')?'red':'');
function heading(en,title,subtitle,buttons=''){return `<div class="pageheading"><div><div class="eyebrow">${en}</div><h1>${title}</h1><p class="sub">${subtitle}</p></div><div>${buttons}</div></div>`;}
function table(headers,rows,emptyText='暂无记录'){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${headers.length}" class="empty">${emptyText}</td></tr>`}</tbody></table></div>`;}
function stat(label,value,note){return `<div class="stat"><div class="label">${label}</div><div class="num">${value}</div><small>${note}</small></div>`;}
function dateMonth(){return month||today().slice(0,7);}
function matches(p){return !search||(p.code+' '+p.name+' '+p.category).toLowerCase().includes(search.toLowerCase());}

function dashboard(){
 const m=dateMonth(),end=m+'-31',asof=end<today()?end:today(),s=C.calc(data,asof).stocks,rs=C.report(data,m,'sale'),own=C.report(data,m,'self');
 const purchase=data.transactions.filter(t=>!t.void&&t.date.startsWith(m)&&['purchase','purchaseReturn'].includes(t.type)).reduce((a,t)=>a+t.qty*t.price*(t.type==='purchase'?1:-1),0);
 const low=data.products.filter(p=>s[p.code]?.available<=p.threshold);const recent=data.transactions.filter(t=>!t.void).slice().sort((a,b)=>b.date.localeCompare(a.date)||b.seq-a.seq).slice(0,5);
 const months=Array.from({length:6},(_,i)=>{const d=new Date(+m.slice(0,4),+m.slice(5)-1-5+i,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;});

 return `<section class="hero"><div><div class="eyebrow">HONGSHENG / DAILY OPERATIONS</div><h1>每一笔流转，<br>都有清晰的去向。</h1><p>商品一键带出 · 库存即时计算 · 月报自动归集</p><button data-action="new">＋ 记录一笔出入库　↗</button></div><div class="heroArt" aria-hidden="true"><div class="bottle"></div><div class="yearmark">THE CELLAR / 2026</div></div></section>
 <div class="cardhead"><div><h2>经营概览</h2><div class="sub" style="margin-bottom:0">按业务发生月份统计 · 库存截至 ${esc(asof)}</div></div>${monthInput()}</div>
 <div class="stats">${stat('本月采购净额',`¥ ${money(purchase)}`,'采购入库减采购退货')}${stat('中建三局 · 本月净出库金额',`¥ ${money(rs.reduce((a,t)=>a+t.amount,0))}`,'原成交口径 · 未含对账价差')}${stat('老板自用 · 本月记录净额',`¥ ${money(own.reduce((a,t)=>a+t.amount,0))}`,'历史按原表金额；新增按暂算成本')}${stat('在库商品 / 预警',`${data.products.filter(p=>s[p.code]?.qty>0).length} <span style="font-size:16px">/ ${low.length}</span>`,'商品种数，不混加瓶、条、盒')}</div>
 ${!data.products.length?`<div class="card empty"><strong>从一份商品档案开始</strong>网站已就绪。导入之前下载的历史JSON，或先建立商品，即可开始使用。<br><button class="primary" data-action="import">导入历史数据 / 备份</button> <button data-action="product">＋ 新建商品</button></div>`:provisional()}

 <div class="grid2"><section class="card"><div class="cardhead"><h2>最近流水</h2><a href="#inventory">查看全部 ↗</a></div>${table(['日期 / 类型','商品','数量','记录金额'],recent.map(t=>`<tr><td>${esc(t.date)}<br>${kind(t.type)}</td><td>${esc(product(t.code)?.name)}<small>${esc(t.code)}</small></td><td>${num(t.qty)} ${esc(product(t.code)?.unit)}</td><td class="amount">${money(t.qty*t.price)}</td></tr>`))}</section><section class="card"><div class="cardhead"><h2>库存提醒</h2><a href="#inventory">查看库存 ↗</a></div>${low.length?low.slice(0,5).map(p=>`<div class="issue"><b>${esc(p.name)}</b><p>可用 ${num(s[p.code].available)} ${esc(p.unit)} · 预警线 ${num(p.threshold)} ${esc(p.unit)}</p></div>`).join(''):'<div class="empty">库存充足，或尚未设置预警线。</div>'}</section></div>`;

function entry(){return heading('QUICK ENTRY','一笔录入，全表更新','先选择业务，再选商品。名称、单位和参考价格自动带出。')+`<div class="grid2"><section class="card"><div class="flowsteps"><span>01 选择业务</span><span>02 选择商品</span><span>03 核实并保存</span></div>${entryForm()}</section><div><section class="card"><div class="cardhead"><h2>少填一些，更准确一些</h2></div><div class="issue"><b>商品资料自动带出</b><p>输入商品编码或名称，选择匹配商品后自动读取基础资料。</p></div><div class="issue"><b>价格按场景读取</b><p>采购参考该日期以前最近进价；三局出库参考最近成交价；自用按流水暂算成本。</p></div><div class="issue"><b>退回关联原单</b><p>价格沿用原单，数量不能超过原单剩余可退数量。</p></div><div class="issue"><b>库存不足会阻止保存</b><p>有订单占用时，可用库存等于实物库存减去未提货占用。</p></div><button class="ghost" data-action="product" style="margin-top:18px">＋ 找不到商品？新建档案</button></section>${provisional()}</div></div>`;}
function entryForm(defaults={}){return `<form id="entryForm"><div class="fieldgrid"><div class="field"><label for="entryDate">业务日期</label><input id="entryDate" name="date" type="date" value="${defaults.date||today()}" required></div><div class="field"><label for="entryType">业务类型</label><select id="entryType" name="type">${Object.entries(C.TYPES).map(([k,v])=>`<option value="${k}" ${(defaults.type||txType||'purchase')===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="field full"><label for="entryProduct">商品编码 / 商品名称</label><input id="entryProduct" name="query" list="productOptions" placeholder="输入编码或名称，然后选择商品" autocomplete="off" required><datalist id="productOptions">${data.products.map(p=>`<option value="${esc(p.code+' · '+p.name)}"></option>`).join('')}</datalist></div><div class="field full" id="originalWrap" hidden><label for="entryOriginal">原始单据</label><select id="entryOriginal" name="original"><option value="">请先选择商品</option></select></div></div><div id="productPreview" class="productpreview"><strong>等待选择商品</strong><p>资料由商品档案带出，无需重复输入。</p></div><div class="fieldgrid"><div class="field"><label for="entryQty">本次数量</label><input id="entryQty" name="qty" type="number" min="0.001" step="0.001" placeholder="输入数量" required></div><div class="field"><label for="entryPrice">本次单价（元）</label><input id="entryPrice" name="price" type="number" min="0" step="0.000001" required><small id="priceHint">参考价可调整，保存时使用本次单价。</small></div><div class="field full"><label for="entryNote">备注（选填）</label><textarea id="entryNote" name="note" rows="2" maxlength="300" placeholder="例如：送货、临时调价原因"></textarea></div></div><div class="amountbox"><span>本笔记录金额</span><strong id="entryAmount">¥ 0.00</strong></div><div class="formbuttons"><button type="submit" class="primary" name="mode" value="keep">保存并继续录入</button><button type="submit" name="mode" value="done">保存并查看流水</button></div></form>`;}
function selectedProduct(form){const query=form.elements.query.value.trim();return data.products.find(p=>query===p.code+' · '+p.name||query===p.code);}
function bindEntry(form){
 let dirty=false;const el=name=>form.elements[name];
 const update=(resetPrice=true)=>{
  const p=selectedProduct(form),type=el('type').value,ret=type.endsWith('Return');$('#originalWrap').hidden=!ret;
  if(!p){$('#productPreview').innerHTML='<strong>请选择有效商品</strong><p>从列表选择，或输入完整编码。</p>';el('price').value='';return;}
  const stock=C.calc(data,el('date').value).stocks[p.code];$('#productPreview').innerHTML=`<strong>${esc(p.name)}</strong><p>${esc(p.code)} · ${esc(p.category)} · ${esc(p.spec||'规格待补充')} · ${esc(p.unit)}</p><p>当日实物库存 ${num(stock.qty)} ${esc(p.unit)}　/　可用 ${num(stock.available)} ${esc(p.unit)} ${p.review?' · 商品信息待核对':''}</p>`;
  if(ret){const originalType={saleReturn:'sale',selfReturn:'self',purchaseReturn:'purchase'}[type];const prev=el('original').value;el('original').innerHTML='<option value="">请选择原单</option>'+data.transactions.filter(t=>!t.void&&t.code===p.code&&t.type===originalType&&t.date<=el('date').value).map(t=>{const used=data.transactions.filter(r=>!r.void&&r.original===t.id).reduce((a,r)=>a+r.qty,0);return `<option value="${esc(t.id)}">${esc(t.date)} / ${num(t.qty-used)} ${esc(p.unit)}可退 / ¥${money(t.price)} / #${t.seq}</option>`;}).join('');if([...el('original').options].some(o=>o.value===prev))el('original').value=prev;const orig=data.transactions.find(t=>t.id===el('original').value);el('price').value=orig?.price??'';el('price').readOnly=true;$('#priceHint').textContent='退回单价沿用原单，不覆盖历史成交价。';}
  else{el('price').readOnly=type==='self';if(resetPrice)el('price').value=type==='self'?Math.max(0,stock.avg).toFixed(6):C.priceAt(data,p.code,type,el('date').value);$('#priceHint').textContent=type==='self'?'按该日期已有流水的移动平均成本暂算，保存后保留本次金额。':type==='purchase'?'最近采购价仅供参考；确认本次实际采购价。':'最近三局成交价仅供参考；确认本次实际结算价。';}
  amount();
 };
 const amount=()=>{$('#entryAmount').textContent='¥ '+money((+el('qty').value||0)*(+el('price').value||0));};
 el('query').oninput=()=>{dirty=false;update();};el('type').onchange=()=>{dirty=false;update();};el('date').onchange=()=>update(!dirty);el('original').onchange=()=>update();el('qty').oninput=amount;el('price').oninput=()=>{dirty=true;amount();};
 form.onsubmit=e=>{e.preventDefault();const p=selectedProduct(form);if(!p)return toast('请先选择商品档案中的商品。');const type=el('type').value,date=el('date').value,qty=+el('qty').value,price=+el('price').value;if(date>today())return toast('实际出入库不能使用未来日期；待提货请建立订单。');if(!(qty>0)||price<0||!Number.isFinite(price))return toast('请填写有效数量和单价。');

  const t={id:uid(),seq:Math.max(0,...data.transactions.map(t=>t.seq))+1,date,type,code:p.code,qty,price,note:el('note').value.trim(),...(type.endsWith('Return')?{original,...(data.transactions.find(r=>r.id===original)?.orderId?{orderId:data.transactions.find(r=>r.id===original).orderId}:{})}:{})};

 };

function noNewShortages(old,next){const dates=[...new Set([...old.transactions,...next.transactions,...old.orders,...next.orders].map(t=>t.date))];for(const d of dates){const a=C.calc(old,d).stocks,b=C.calc(next,d).stocks;for(const code of Object.keys(b))if(b[code].available<Math.min(0,a[code]?.available||0)-1e-8)return false;}return true;}

 $('#productForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),v=Object.fromEntries(f.entries());for(const k of ['code','name','category','spec','unit'])v[k]=(v[k]||'').trim();for(const k of ['purchasePrice','salePrice','threshold'])v[k]=+v[k];v.review=f.has('review');if(!/^[A-Za-z0-9_-]+$/.test(v.code))return toast('编码仅使用字母、数字、下划线或短横线。');if(!v.name||!v.unit)return toast('请补齐名称与单位。');if(!code&&product(v.code))return toast('编码已存在，请直接编辑。');if(code&&data.transactions.some(t=>t.code===code)&&v.unit!==p.unit)return toast('已有流水的商品不能直接改单位，请新建不同规格的商品。');if(mutate(d=>{const i=d.products.findIndex(p=>p.code===v.code);if(i>=0)d.products[i]=v;else d.products.push(v);},`保存商品 ${v.code}`)){closeModal();render();toast('商品档案已保存。');}};

function inventory(){const s=C.calc(data,today()).stocks;const ps=data.products.filter(p=>matches(p)&&(!stockFilter||s[p.code].available<=p.threshold));const trs=data.transactions.filter(t=>!t.void&&(!month||t.date.startsWith(month))&&(!txType||t.type===txType)&&matches(product(t.code)||{})).slice().sort((a,b)=>b.date.localeCompare(a.date)||b.seq-a.seq);return heading('INVENTORY & LEDGER','库存与流水','库存截至今天；流水可按月和业务筛选。原始记录保留来源行号。')+provisional()+`<div class="toolbar"><input id="search" value="${esc(search)}" placeholder="搜索商品编码或名称" aria-label="搜索库存"><select id="stockFilter" aria-label="库存范围"><option value="">全部库存</option><option value="low" ${stockFilter?'selected':''}>仅看预警</option></select><button data-action="inventoryCSV">导出库存 CSV</button></div><section class="card"><div class="cardhead"><h2>实时库存</h2><span class="muted">${ps.length} 个商品</span></div>${table(['商品','基础单位','实物数量','未提货占用','可用数量','预警线','成本状态'],ps.map(p=>{const v=s[p.code];return `<tr><td>${esc(p.name)}<small>${esc(p.code)}</small></td><td>${esc(p.unit)}</td><td>${num(v.qty)}</td><td>${num(v.reserved)}</td><td>${pill(num(v.available),v.available<=p.threshold?'red':'green')}</td><td>${num(p.threshold)}</td><td>${pill(v.uncertain||data.meta.opening!=='已核定'?'待核定':'按流水计算',v.uncertain?'red':'')}</td></tr>`;}))}</section><section class="card"><div class="cardhead"><h2>出入库流水</h2><span class="muted">${trs.length} 笔</span></div><div class="toolbar"><input id="month" aria-label="流水月份，留空显示全部" type="month" value="${esc(month)}"><select id="txType" aria-label="流水业务"><option value="">全部业务</option>${Object.entries(C.TYPES).map(([k,v])=>`<option value="${k}" ${txType===k?'selected':''}>${v}</option>`).join('')}</select><button data-action="clearFilter">清除筛选</button><span class="spacer"></span><button data-action="ledgerCSV">导出筛选流水 CSV</button></div>${table(['日期 / 编号','类型','商品','数量','单价','金额','备注 / 来源','操作'],trs.map(t=>`<tr><td>${esc(t.date)}<small>#${t.seq}</small></td><td>${kind(t.type)}</td><td>${esc(product(t.code)?.na "><span>${rows.length} 笔记录 · ${Object.keys(groups).length} 种商品 · 退回以负数抵减</span><strong>¥ ${money(amount)}</strong></div><p class="sub" style="margin-top:15px">${isSale?'中建三局基础设施建设投资有限公司':'老板自用 / 盛总自用'} · 生成日期 ${today()}。库存成本和历史异常尚未确认前，不输出确定毛利。</p></section>`;}

function csv(name,rows){const cell=v=>{const s=String(v??'');return '"'+(/^[=+@\t\r]/.test(s)||/^-\D/.test(s)?"'":'')+s.replace(/"/g,'""')+'"';};download(name,'\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8');}

function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++;}else quoted=!quoted;}else if(c===','&&!quoted){row.push(cell);cell='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(c=>c.trim()))rows.push(row);row=[];cell='';}else cell+=c;}if(quoted)throw Error('CSV引号未闭合');row.push(cell);if(row.some(c=>c.trim()))rows.push(row);return rows;}

 else if(action==='cancelOrder')confirmModal('关闭待提货订单？','只释放剩余占用，已提货记录继续保留。',()=>{if(mutate(d=>d.orders.find(o=>o.id===id).void=true,'关闭订单 '+id))render();});
 else if(action==='issue'){const i=data.issues[+id];showModal('记录核对说明',`<form id="issueForm"><h3>${esc(i.title)}</h3><p class="sub">${esc(i.detail)}</p><div class="field"><label>处理说明</label><textarea name="resolution" rows="4" required maxlength="1000">${esc(i.resolution||'')}</textarea></div><p class="sub">此操作只保存说明，不修改历史流水、编码或价格。</p><div class="formbuttons"><button class="primary">保存说明</button></div></form>`);$('#issueForm').onsubmit=e=>{e.preventDefault();const r=e.target.elements.resolution.value.trim();if(!r)return;if(mutate(d=>{d.issues[+id].resolved=true;d.issues[+id].resolution=r;},'记录异常核对说明')){closeModal();render();}};}
 else if(action==='opening'){showModal('期初核定状态',`<form id="openingForm"><p class="sub">请完成实物盘点和历史差异核对。此处不会自动补库存，若需要期初数量，请在正式上线前整理准确的期初及切换日期。</p><div class="field"><label>核定状态</label><select name="opening"><option>未核定</option><option>已核定</option></select></div><div class="field"><label>核对说明 / 盘点依据</label><textarea name="note" required rows="3"></textarea></div><div class="formbuttons"><button class="primary">记录状态</button></div></form>`);$('#openingForm').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));if(v.opening==='已核定'&&data.issues.some(i=>!i.resolved))return toast('仍有未处理的历史核对项，请先记录处理说明。');if(mutate(d=>{d.meta.opening=v.opening;d.meta.openingNote=v.note;},'记录期初状态 '+v.opening)){closeModal();render();}};}
 else if(action==='guide')showModal('部署与使用',`<div class="guide"><ol><li>解压网页包，将 index.html、style.css、core.js、app.js、.nojekyll 上传到 GitHub 仓库根目录。</li><li>仓库 Settings → Pages → Deploy from a branch → main / (root) → Save。</li><li>打开 Pages 地址，进入数据与设置，导入单独下载的历史JSON。该JSON不要上传GitHub。</li><li>先核对异常、商品规格及期初库存，再录入正式新业务。浏览器默认统计当前月份，可手动切到2026年10月查看历史。</li><li>每天导出完整备份；CSV用于查看和交接，完整恢复需要JSON。</li></ol></div>`);
 else if(action==='demo')confirmModal('切换到演示数据？','将先下载当前完整备份，然后使用虚构商品演示。请确认备份下载成功后，再恢复真实数据。',()=>{backup();const d=empty();d.meta={name:'演示',opening:'已核定'};d.products=[{code:'DEMO01',name:'演示 · 珍藏红葡萄酒',category:'红酒',spec:'750ml / 瓶',unit:'瓶',purchasePrice:180,salePrice:280,threshold:6}];d.transactions=[{id:'demo-in',seq:1,date:today(),type:'purchase',code:'DEMO01',qty:24,price:180,note:'虚构演示数据'},{id:'demo-sale',seq:2,date:today(),type:'sale',code:'DEMO01',qty:6,price:280,note:'虚构演示数据'},{id:'demo-self',seq:3,date:today(),type:'self',code:'DEMO01',qty:2,price:180,note:'虚构演示数据'}];if(commit(d,'加载虚构演示数据')){month=today().slice(0,7);render();toast('当前为虚构演示，恢复真实JSON可切回。');}});
});
document.addEventListener('change',e=>{if(e.target.id==='month'){month=e.target.value;render();}else if(e.target.id==='client'){client=e.target.value;render();}else if(e.target.id==='txType'){txType=e.target.value;render();}else if(e.target.id==='stockFilter'){stockFilter=e.target.value;render();}else if(e.target.id==='reportTab'){tab=e.target.value;render();}});
let searchTimer;document.addEventListener('input',e=>{if(e.target.id==='search'){const pos=e.target.selectionStart;search=e.target.value;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{render();const inp=$('#search');if(inp){inp.focus();inp.setSelectionRange(pos,pos);}},180);}});
$('#jsonFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>20*1024*1024)throw Error('文件超过20MB');const next=C.valid(JSON.parse(await f.text()));showModal('确认导入数据',`<p>检测到 <b>${next.products.length}</b> 个商品、<b>${next.transactions.length}</b> 笔流水、<b>${next.orders.length}</b> 张订单。</p><div class="notice wine">导入会整体替换当前数据。请先下载当前备份；不合并重复记录。</div><div class="formbuttons"><button data-action="backup">先下载当前备份</button><button id="acceptImport" class="primary">确认替换并导入</button></div>`);$('#acceptImport').onclick=()=>{if(commit(next,'导入完整数据 '+f.name)){closeModal();month='';search='';render();toast('导入成功。可切换月份查看历史报表。');}};}catch(err){toast('导入失败：'+err.message);}};
$('#csvFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const rows=parseCSV((await f.text()).replace(/^\ufeff/,''));const hdr=['商品编码','商品名称','类别','规格','单位','参考采购价','三局参考价','预警线'];if(JSON.stringify(rows.shift())!==JSON.stringify(hdr))throw Error('列名不匹配，请先导出商品CSV作为模板');const next=JSON.parse(JSON.stringify(data)),seen=new Set();for(const r of rows){if(r.length!==8)throw Error('列数必须为8');const code=r[0].trim();if(!/^[A-Za-z0-9_-]+$/.test(code)||seen.has(code))throw Error('编码无效或文件中重复');seen.add(code);if(next.products.some(p=>p.code===code))throw Error('编码 '+code+' 已存在，CSV仅用于新增商品');const numbers=r.slice(5).map(Number);if(numbers.some(n=>!Number.isFinite(n)||n<0))throw Error('价格或预警线不是有效数字');next.products.push({code,name:r[1].trim(),category:r[2].trim(),spec:r[3].trim(),unit:r[4].trim(),purchasePrice:numbers[0],salePrice:numbers[1],threshold:numbers[2],review:false});}C.valid(next);confirmModal('导入商品CSV？',`将新增 ${rows.length} 个商品，不修改现有档案。`,()=>{if(commit(next,'CSV新增商品')){render();toast('商品CSV已导入。');}});}catch(err){toast('CSV未导入：'+err.message);}};
$('#closeModal').onclick=closeModal;$('#menutoggle').onclick=()=>document.body.classList.toggle('navopen');
window.addEventListener('hashchange',()=>{page=location.hash.slice(1)||'dashboard';search='';txType=page==='entry'?txType:'';document.body.classList.remove('navopen');render();window.scrollTo(0,0);});
window.addEventListener('storage',e=>{if(e.key===KEY){load();closeModal();render();toast('另一个标签页已更新数据，当前页面已重新加载。');}});
load();$('#today').textContent=new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'short'});page=location.hash.slice(1)||'dashboard';render();
</script></body></html>
